<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Customize Order</title>
        <link rel="icon" href="logo.jpeg">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <header>
            <img src="logo.jpeg" alt="Sweet Scoops Ice Cream Logo" class="logo">
            <h1 class="store-name">Sweet Scoops Ice Cream</h1>
        </header>

        <div class="navbar">
            <a href="index.html">Home</a>
            <a href="menu_view.html">Menu</a>
        </div>

        <main>
            <div class="customize-main">
                <strong><p id="order-timer">Order Time remaining: 00:00</p></strong>

                <img src="Picture2.jpeg" alt="banner" class="banner">

                <form id="order-form">
                    <h1>Vanilla Dream</h1>
                    <h2>Choose Type:</h2>

                    <label>
                        <input type="radio" name="serving" value="Cup">
                        <strong>Cup</strong>
                    </label><br><br>

                    <label>
                        <input type="radio" name="serving" value="Cone">
                        <strong>Cone</strong>
                    </label><br><br>

                    <h1>Chocolate Bliss</h1>
                    <h2>Select Toppings:</h2>

                    <label>
                        <input type="checkbox" name="topping" value="Sprinkles">
                        <strong>Sprinkles</strong>
                    </label><br><br>

                    <label>
                        <input type="checkbox" name="topping" value="Nuts">
                        <strong>Nuts</strong>
                    </label><br><br>

                    <label>
                        <input type="checkbox" name="topping" value="Caramel">
                        <strong>Caramel</strong>
                    </label><br><br>

                    <p id="total-price">Total Price: $0.00</p>

                    <button type="submit">Submit Order</button>
                </form>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Sweet Scoops Ice Cream. All rights reserved.</p>
        </footer>

        <script src="customize_order.js"></script>
    </body>
</html>
