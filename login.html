<!-- login.html -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="icon" href="logo.jpeg">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <header>
            <img src="logo.jpeg" alt="Sweet Scoops Ice Cream Logo" class="logo">
            <h1 class="store-name">Sweet Scoops Ice Cream</h1>
        </header>

        <div class="navbar">
            <a href="index.html">Home</a>
        </div>

        <main class="login-main">
            <div>
                <h1>Welcome back!</h1>
                
                <form action="menu_view.html">
                    <label for="username">Username:</label><br>
                    <input type="text" id="username" name="username"><br>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password"><br>
                    <input type="checkbox" id="forgot" name="forgot">
                    <label for="forgot">Forgot Password</label><br>
                    <input type="submit" value="Login">
                </form>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Sweet Scoops Ice Cream. All rights reserved.</p>
        </footer>
    </body>
</html>
