<!-- signup.html -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up</title>
        <link rel="icon" href="logo.jpeg">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <header>
            <img src="logo.jpeg" alt="Sweet Scoops Ice Cream Logo" class="logo">
            <h1 class="store-name">Sweet Scoops Ice Cream</h1>
        </header>

        <div class="navbar">
            <a href="index.html">Home</a>
        </div>

        <main class="login-main">
            <div>
                <h1>Signup</h1>
                
                <form id="signupForm" action="menu_view.html">
                    <label for="username">Username:</label><br>
                    <input type="text" id="username" name="username"><br>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email"><br>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password"><br>
                    <label for="confirm-password" id="confirm-label">Confirm Password:</label><br>
                    <input type="password" id="confirm-password" name="confirm-password"><br>
                    <input id="signup-button" type="submit" value="Signup"><br>
                    
                </form>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Sweet Scoops Ice Cream. All rights reserved.</p>
        </footer>

        <script src="signup.js"></script>
    </body>
</html>
