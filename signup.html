<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up</title>
        <link rel="icon" href="logo.jpeg">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <header>
            <img src="logo.jpeg" alt="Sweet Scoops Ice Cream Logo" class="logo">
            <h1 class="store-name">Sweet Scoops Ice Cream</h1>
        </header>

        <div class="navbar">
            <a href="index.html">Home</a>
        </div>

        <main class="login-main">
            <h1>Sign Up</h1>

            <form id="signupForm">
                <label for="signupUsername">Username:</label><br>
                <input type="text" id="signupUsername" name="signupUsername" required><br><br>

                <label for="signupPassword">Password:</label><br>
                <input type="password" id="signupPassword" name="signupPassword" required><br><br>

                <label for="confirmPassword">Confirm Password:</label><br>
                <input type="password" id="confirmPassword" name="confirmPassword" required><br><br>

                <label for="signupEmail">Email:</label><br>
                <input type="text" id="signupEmail" name="signupEmail" required><br><br>

                <button type="submit" class="signup-button">Sign Up</button>
            </form>

            <div id="signupMessage" class="message-box"></div>
        </main>

        <script src="signup.js"></script>
    </body>
</html>
